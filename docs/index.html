/* Same UI supports the local Python API and a read-only GitHub Pages preview. */
let state, view = 'overview', busy = false;
const staticMode = Boolean(window.FIELDNOTE_DEMO_STATE) || !['127.0.0.1', 'localhost'].includes(location.hostname) || location.search.includes('static=1');

const tag = (text, amber=false) => `<span class="tag ${amber?'amber':''}">${esc(text)}</span>`;
const phaseMap = {overview:'调研方法与任务拆分',evidence:'现状解读与场景特征',scenarios:'现状解读与场景特征',fieldwork:'问卷与访谈材料生成',analysis:'行业数据分析',report:'综合研究报告'};
const titles = {overview:['RESEARCH BRIEF','让场景从证据里浮现','先理解真实工作，再判断 AI 在哪里产生作用。'],evidence:['EVIDENCE LIBRARY','每一个判断，都有来处','汇集通用知识、行业资料和一手材料，保留口径与适用边界。'],scenarios:['SCENARIO ATLAS','看清任务，也看清人','把流程、决策、组织策略和用户心理放进同一个场景。'],fieldwork:['FIELD RESEARCH','把问题带回真实现场','用最近一次具体事件，核实公开资料无法回答的问题。'],analysis:['SAMPLE ANALYSIS','先看样本，再谈趋势','区分个人与企业、使用与收益、缺失与零值。'],report:['RESEARCH OUTPUT','结论与未知，一起交付','把证据、推断、反例和下一步整理成可分享的研究报告。']};
function notice(text,error=false){$('#notice').textContent=text;$('#notice').className=error?'error':'';$('#notice').style.display='block'}
async function api(path,data){if(staticMode)throw Error('当前是只读预览。下载或克隆仓库后运行 python3 app.py，可使用录入、分析和Agent。');const r=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});const out=await r.json();if(!r.ok)throw Error(out.error||'请求失败');return out}
function hero(){const t=titles[view];return `<div class="hero"><div><div class="eyebrow">${t[0]} / ${esc(state.project.scope.as_of)}</div><h1>${t[1]}</h1><p>${t[2]}</p></div>${tag(staticMode?'只读公开 Demo':state.config.model_configured?'模型已配置':'资料 Demo · 模型未配置',!state.config.model_configured)}</div>`}
function agentPanel(){return `<div class="panel"><h2>研究 Agent</h2><p class="muted">当前任务：${phaseMap[view]}。模型可自主查询证据、分析样本和选择公开搜索；每次最多 ${state.config.max_rounds||6} 轮、${state.config.search_budget??3} 次搜索。生成结果需要人工复核。</p><label class="check"><input type="checkbox" id="external-consent">我确认项目材料已脱敏，同意将当前项目材料发送给所配置的模型服务。</label><div class="actions"><button id="run-agent" ${busy?'disabled':''}>${busy?'正在研究，请稍候…':'运行当前研究任务 ↗'}</button><span class="muted">${state.config.model_configured?'已配置 '+esc(state.config.model):'在 .env 配置模型后可用'} · ${state.config.search_configured?'联网搜索已配置':'可手动导入来源'}</span></div></div>`}
function metrics(){const p=state.project;return `<div class="metrics"><div class="metric"><span>证据来源</span><strong>${p.sources.length.toString().padStart(2,'0')}</strong><small>含方法资料，需逐条核对</small></div><div class="metric"><span>一手访谈 / 观察材料</span><strong>${p.sources.filter(s=>['interview','observation'].includes(s.kind)).length.toString().padStart(2,'0')}</strong><small>材料份数，非独立企业数</small></div><div class="metric"><span>同意参与的问卷回答</span><strong>${p.analysis.n.toString().padStart(2,'0')}</strong><small>覆盖 ${p.analysis.organizations} 个匿名团队</small></div><div class="metric"><span>候选场景</span><strong>${p.scenarios.length.toString().padStart(2,'0')}</strong><small>有一手材料也需核对支持关系</small></div></div>`}
function overview(){const p=state.project;return `<div class="intro-panel"><div><div class="eyebrow">CURRENT RESEARCH</div><h2>${esc(p.scope.title)}</h2><p>${esc(p.scope.goal)}</p></div><div class="scope"><small>本轮研究范围</small><div>${esc(p.scope.segment)}</div><div>${esc(p.scope.region)}</div><small>研究边界可通过新建项目重新定义</small></div></div>${metrics()}<div class="grid"><div class="panel"><h2>低投入研究计划 <span class="muted">/ ${p.plan.reduce((a,t)=>a+Number(t.hours),0)} 小时</span></h2>${p.plan.map((t,i)=>`<div class="task"><span class="num">${i+1}</span><div><strong>${esc(t.task)}</strong> ${tag(t.status)}<p>${esc(t.done)}</p><small>${esc(t.method)}</small></div><small>${t.hours} h</small></div>`).join('')}</div><div><div class="panel"><div class="eyebrow">WHAT WE KNOW / WHAT WE DON'T</div><h2 style="margin-top:15px">当前现状解读</h2><p>${esc(p.interpretation)}</p><div class="callout">当前 ${p.sources.filter(s=>s.kind==='interview').length} 份访谈材料、${p.analysis.n} 份有效回答。没有一手证据时，不能确认目标人群的行为、心理或业务收益。</div></div>${agentPanel()}</div></div>`}
function evidence(){const p=state.project;return `<div class="grid"><div class="panel"><h2>研究证据库</h2>${p.sources.length?p.sources.map(s=>`<article class="source"><div>${tag(s.id)} ${tag(s.kind,s.kind==='search_excerpt')}</div><h3>${esc(s.title)}</h3><p class="muted">发布：${esc(s.date)} · 采集：${esc(s.accessed)}<br>范围：${esc(s.population)}</p><p>${esc(s.note)}</p><div class="callout">${esc(s.limits)}</div>${/^https?:\/\//i.test(s.url||'')?`<a href="${esc(s.url)}" target="_blank" rel="noopener">核对原始来源 ↗</a>`:''}</article>`).join(''):'<div class="empty">尚无来源，请导入材料或运行联网研究。</div>'}</div><div><form id="source-form" class="panel"><h2>录入一份证据</h2><label>材料类型<select name="kind"><option value="public_research">公开研究</option><option value="vendor_research">厂商研究 / 主张</option><option value="interview">访谈口述</option><option value="observation">直接观察记录</option><option value="method">研究方法</option></select></label><label>标题<input name="title" required placeholder="例如：团队A负责人，最近一次方案交付"></label><label>日期<input name="date" placeholder="2026-11-25 或 未核实"></label><label>原始链接，可留空<input name="url" type="url" placeholder="https://..."></label><label>地区、规模、样本 / 角色<input name="population" required></label><label>脱敏证据、摘录或事件记录<textarea name="note" required placeholder="记录具体任务、步骤、原话或观察。不要填入身份信息、密钥或客户资料。"></textarea></label><label>局限与尚未核实的部分<textarea name="limits" required placeholder="例如：单人自述，未观察操作，耗时未经计时"></textarea></label><button>保存证据</button></form>${agentPanel()}</div></div>`}
function scenarios(){return `${metrics()}<div class="callout">场景卡中的流程、决策、策略、心理需要逐项核实；引用公开资料不表示已经在目标团队中观察到这些行为。</div><div class="scenario-grid">${state.project.scenarios.map(s=>`<article class="panel scenario">${tag(s.status,true)} <span class="muted">${esc(s.evidence_ids.join(' · '))}</span><h2>${esc(s.name)}</h2><p class="muted">${esc(s.role)} · ${esc(s.trigger)}</p><div class="flow">${s.workflow.map(esc).join(' → ')}</div><dl>${[['决策因素',s.decision],['行业 / 组织策略',s.strategy],['用户心理 · 待核实',s.psychology],['反例与边界',s.counterexample],['下一步验证',s.next_step]].map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></article>`).join('')||'<div class="empty"><strong>场景仍待发现</strong>导入资料并运行研究，或从创业团队 Demo 开始。</div>'}</div><div style="margin-top:24px">${agentPanel()}</div>`}
function exportUrl(kind){return staticMode?`demo-${kind==='form'?'form.html':kind==='report-html'?'report.html':'report.md'}`:`/api/export/${kind}?id=${state.project.id}`}
function fieldwork(){const f=state.project.instruments;return `<div class="grid"><div class="panel"><div class="section-head" style="margin-top:0"><h2>${esc(f.title)}</h2><a href="${exportUrl('form')}" download>下载可填写问卷 ↗</a></div><p class="muted">${esc(f.intro)}</p>${f.questions.map((q,i)=>`<div class="instrument-question"><strong>${i+1}. ${esc(q.label)}</strong><br><code>${esc(q.id)} · ${esc(q.type)}</code>${q.options?`<p class="muted">${q.options.map(esc).join(' / ')}</p>`:''}</div>`).join('')}</div><div><div class="panel"><div class="eyebrow">30-MINUTE INTERVIEW</div><h2 style="margin-top:12px">真实事件访谈提纲</h2><ol>${f.interview.map(q=>`<li>${esc(q)}</li>`).join('')}</ol><div class="callout">邀约：我在了解你最近怎样完成一项具体工作，包括使用AI和不用AI的情况。约30分钟，希望看看获准使用的脱敏材料；可以随时停止，也可以跳过问题。</div></div><div class="panel"><h2>低成本回收方式</h2><p class="muted">下载单个HTML问卷，通过你选择的渠道分发。受访者用浏览器填写，下载自己的JSON回答后主动交回。研究者在「样本分析」中导入。无需注册或联网；当前不提供云端自动收集。</p><p class="muted">真实数据存于本机，不会随GitHub代码发布；完整项目导出包含原始回答，请谨慎分享。</p></div>${agentPanel()}</div></div>`}
function analysis(){const a=state.project.analysis;return `${metrics()}<div class="grid"><div><div class="panel"><h2>样本中的AI使用状态</h2>${a.n?Object.entries(a.status_counts).map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${v/a.n*100}%"></div></div><span>${v}/${a.n}</span></div>`).join(''):'<div class="empty"><strong>等待真实回答</strong>Demo没有预置虚构问卷样本。</div>'}<p class="muted">${esc(a.limits)}</p></div><div class="panel"><h2>完整耗时对比</h2><p>质量达标且配对完整：<strong>${a.paired_quality_pass_n}</strong> 份<br>平均节省：<strong>${a.mean_saved_minutes===null?'尚无可计算数据':a.mean_saved_minutes+' 分钟'}</strong></p><p class="muted">负数表示AI流程更慢。不能将自报时间直接视为现金收益；质量不达标不计入提效。</p></div></div><div><form id="data-form" class="panel"><h2>导入回答 / CSV</h2><p class="muted">接受一个JSON回答、JSON数组或含字段名的CSV。追加导入；匿名编号重复会拒绝，不静默覆盖。不同意参与的回答不会保存。</p><label>选择 .json / .csv 文件<input type="file" id="data-file" accept=".csv,.json"></label><label>或粘贴内容<textarea name="text" rows="9" required placeholder='[{"consent":"同意","respondent_id":"A-01","organization_id":"A","ai_status":"持续使用"}]'></textarea></label><button>导入并计算</button></form>${agentPanel()}</div></div>`}
function reportView(){return `<div class="grid"><div><div class="panel"><h2>研究交付物</h2><p>报告包含研究范围、现状解读、任务计划、四类场景特征、问卷样本、来源、局限和下一轮验证。</p><div class="actions"><a class="tag" href="${exportUrl('report')}" download>下载 Markdown 报告 ↗</a><a class="tag" href="${exportUrl('report-html')}" download>下载 HTML / 打印 PDF ↗</a>${staticMode?'':`<a class="tag amber" href="${exportUrl('project')}" download>导出完整项目 · 含私有材料</a>`}</div><div class="callout">当前交付是探索性研究，保留假设和未知。报告导出不代表结论已经通过人工核验。</div></div><div class="panel"><h2>Agent执行记录</h2>${state.project.runs.length?state.project.runs.map(r=>`<div class="run-summary">${esc(r.at)} · ${esc(r.phase)} · ${esc(r.status)}<details><summary>查看工具调用记录</summary><pre>${esc(JSON.stringify(r.trace,null,2))}</pre></details></div>`).join(''):'<div class="empty">尚未执行在线模型任务。当前内容来自公开资料整理与研究模板。</div>'}</div></div><div>${agentPanel()}<div class="panel"><h2>下一轮最值得补的证据</h2><ol><li>同一任务在不同团队中的真实流程与替代方案。</li><li>持续使用和尝试后放弃的对照事件。</li><li>用户本人解释的购买、信任、担忧与验收标准。</li><li>质量达标前提下，包含检查与返工的总成本。</li></ol></div></div></div>`}
function render(){const p=state.project;$('#current-title').textContent=p.scope.title;$('#projects').innerHTML=state.projects.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.title)}</option>`).join('');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#content').innerHTML=hero()+({overview,evidence,scenarios,fieldwork,analysis,report:reportView}[view])();bind()}
function fail(e){notice(e.message,true)}
async function mutate(path,body){if(busy)return;try{state=await api(path,{id:state.project.id,...body});render();notice('已保存。研究证据和原始回答保留在本机。')}catch(e){fail(e)}}
function bind(){const sf=$('#source-form');if(sf)sf.onsubmit=e=>{e.preventDefault();mutate('/api/source',{source:Object.fromEntries(new FormData(sf))})};const df=$('#data-form');if(df){df.onsubmit=e=>{e.preventDefault();mutate('/api/data',{text:new FormData(df).get('text')})};$('#data-file').onchange=async e=>{if(e.target.files[0])df.elements.text.value=await e.target.files[0].text()}}const run=$('#run-agent');if(run)run.onclick=async()=>{if(staticMode)return notice('只读公开Demo不执行付费模型调用。克隆仓库后可运行完整工具。',true);if(!state.config.model_configured)return notice('请复制 .env.example 为 .env，配置 LLM_BASE_URL、LLM_MODEL、LLM_API_KEY 后重启服务。',true);if(!$('#external-consent').checked)return notice('请先确认脱敏材料的外部处理范围。',true);busy=true;render();notice('Agent正在选择并调用研究工具。可查看其他页，请勿关闭服务。');try{state=await api('/api/agent',{id:state.project.id,phase:phaseMap[view],consent_external:true});notice('研究任务已完成。请核对新结论与原始证据的支持关系。')}catch(e){fail(e)}finally{busy=false;render()}}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;location.hash=view;render()});$('#projects').onchange=async e=>{if(busy)return notice('当前Agent任务完成后可切换项目。',true);try{state=await api('/api/state?id='+encodeURIComponent(e.target.value));render()}catch(e){fail(e)}};$('#new-project').onclick=()=>{if(staticMode)return notice('公开预览仅展示Demo。完整本地工具支持创建不同垂直行业研究。',true);$('#new-dialog').showModal()};$('#new-form').onsubmit=async e=>{e.preventDefault();if(busy)return;try{state=await api('/api/new',Object.fromEntries(new FormData(e.target)));$('#new-dialog').close();view='overview';render();notice('已创建研究。新项目没有预置行业结论。')}catch(e){fail(e)}};
(async()=>{try{state=staticMode?(window.FIELDNOTE_DEMO_STATE||await(await fetch('demo-state.json')).json()):await api('/api/state');if(titles[location.hash.slice(1)])view=location.hash.slice(1);render();if(staticMode)notice('公开只读Demo：已收录真实公开来源，真实访谈与问卷样本为0。完整工具可在GitHub下载。')}catch(e){fail(e)}})();
</script>
</body></html>
