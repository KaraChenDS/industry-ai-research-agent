<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI应用研究问卷</title><style>body{max-width:720px;margin:40px auto;padding:24px;background:#f5f6f0;color:#253e32;font:16px/1.8 system-ui}label{display:block;margin-top:24px}input,textarea,select{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #b7c2b7;border-radius:8px;background:white}button{margin-top:30px;padding:14px;background:#294e3b;color:white;border:0;border-radius:8px}</style><h1></h1><p></p><form></form><script>
const schema={"title": "小型创业公司办公场景 · AI应用行为筛选表", "intro": "约5分钟。仅用于研究，自愿参加，可跳过非必填题。请勿填写姓名、客户信息、商业秘密。回答仅保存在你下载的文件里，需由你主动交给研究者。", "questions": [{"id": "consent", "label": "是否同意将以下脱敏回答用于本次调研？", "type": "select", "options": ["同意", "不同意"], "required": true}, {"id": "respondent_id", "label": "匿名编号（例如团队A-01，不填写真实姓名）", "type": "text", "required": true}, {"id": "organization_id", "label": "团队匿名编号（同团队成员请填写相同编号）", "type": "text", "required": true}, {"id": "role", "label": "你的主要岗位或职责", "type": "text", "required": true}, {"id": "team_size", "label": "团队人数", "type": "select", "options": ["1—4", "5—10", "11—20", "21—50", "51以上"], "required": true}, {"id": "ai_status", "label": "过去两周，你在工作中使用AI的情况", "type": "select", "options": ["持续使用", "偶尔使用", "尝试后放弃", "未使用"], "required": true}, {"id": "recent_task", "label": "最近一次具体工作任务是什么？当时需要交付什么？", "type": "textarea"}, {"id": "workflow", "label": "从收到任务到交付，依次做了什么？哪些步骤用AI，哪些自己做？", "type": "textarea"}, {"id": "decision", "label": "最近一次选择或放弃某个AI工具，主要考虑什么？谁决定购买？", "type": "textarea"}, {"id": "strategy", "label": "团队是否有工具、预算、数据使用、验收方面的约定？请举例；没有可填没有。", "type": "textarea"}, {"id": "psychology", "label": "最近一次使用或不用AI时，你最在意什么？发生了什么具体情况？", "type": "textarea"}, {"id": "baseline_min", "label": "同类任务原来总耗时（分钟，不清楚可留空）", "type": "number"}, {"id": "ai_total_min", "label": "使用AI后的全部耗时，含准备、检查、修改（分钟，不清楚可留空）", "type": "number"}, {"id": "quality_pass", "label": "AI辅助后的交付是否达到原有标准？", "type": "select", "options": ["", "是", "否", "不清楚"]}, {"id": "failure", "label": "最近一次失败、返工或放弃AI的例子，以及最后如何完成任务", "type": "textarea"}], "interview": ["0—5分钟：确认团队、岗位和近两周任务，选择最近一次具体任务。", "5—15分钟：请展示获准使用的脱敏材料，逐步复盘输入、操作、AI交互、人工修改和最终交付。", "15—20分钟：追问谁推荐、谁使用、谁采购、谁验收；为什么选择或放弃；比较现有替代办法。", "20—25分钟：询问团队预算、协作和数据规则如何影响选择；用具体事件追问担忧与期待，不代替用户解释心理。", "25—30分钟：核对总耗时、质量、失败例子；询问能否提供脱敏样例并约下一次任务复测。"]};document.querySelector('h1').textContent=schema.title;document.querySelector('p').textContent=schema.intro;
const form=document.querySelector('form');for(const q of schema.questions){const label=document.createElement('label');label.textContent=q.label+(q.required?' *':'');const el=document.createElement(q.type==='select'?'select':q.type==='textarea'?'textarea':'input');el.name=q.id;el.required=!!q.required;if(q.type==='select'){const empty=document.createElement('option');empty.value='';empty.textContent='请选择';el.append(empty);for(const v of q.options){const op=document.createElement('option');op.value=v;op.textContent=v;el.append(op)}}else if(q.type!=='textarea'){el.type=q.type; if(q.type==='number'){el.min=0;el.step='any'}}label.append(el);form.append(label)}const b=document.createElement('button');b.textContent='下载我的回答，主动交给研究者';form.append(b);form.onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.consent!=='同意'){alert('未同意参加，不生成研究回答文件。');return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='research-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
